<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/256/2680/2680593.png">
    <link href="style.css" rel="stylesheet">
    <title>Gerenciador de Eventos</title>
</head>

<body>
    <div id="app">

        <form id="verificacao">

            <input placeholder="Insira o nome do evento" id="event_nome">

            <input type="datetime-local" placeholder="Horário do evento" id="event_hour"> 

            <select id="event_type">
                <option selected disabled>Selecione um evento</option>
                <option>Churrasco</option>
                <option>Festa Noturna / Coquetel</option>
                <option>Aniversário Infantil</option>
            </select>

            <div id="pessoas">

                <input type="number" placeholder="Convidados adultos" id="event_adults">
                <input type="number" placeholder="Convidados crianças" id="event_children">

            </div>

            <span>R$</span>
            <input placeholder="Insira o orçamento" id="event_maxvalue">

            <button type="submit">Confirmar</button>

        </form>

        <div id="visor"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
