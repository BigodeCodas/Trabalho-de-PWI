<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/256/2680/2680593.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="style.css" rel="stylesheet">
    <title>Gerenciador de Eventos</title>
</head>

<body>
    <div id="app">

        <form id="verificacao">
            <label>Insira os dados do evento abaixo</label>
            <input placeholder="Insira o nome do evento" id="event_nome">

            <input type="datetime-local" placeholder="Horário do evento" id="event_hour">

            <select id="event_type">
                <option selected disabled>Selecione um evento</option>
                <option>Churrasco</option>
                <option>Festa Noturna / Coquetel</option>
                <option>Aniversário Infantil</option>
            </select>

            <div class="pessoas">

                <input type="number" placeholder="Adultos" id="event_adults" min="0">
                <input type="number" placeholder="Crianças" id="event_children" min="0">

            </div>
            <div class="orcamento">
                <span>R$</span>
                <input placeholder="Insira o orçamento" id="event_maxvalue">
            </div>
            <button type="submit">Concluído</button>

        </form>

        <div id="visor"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
